name: jvn-monitor
run-name: ${{ github.actor }}
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
    alert:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Setup Nodejs
              uses: actions/setup-node@v6
              with: 
                  node-version: 24
                  cache: npm
              # package-lock.jsonからインストール
            - run: npm ci

            - run: npm run typecheck