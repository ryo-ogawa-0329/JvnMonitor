name: jvn-monitor
run-name: ${{ github.actor }}
on: [push]
jobs:
    alert:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with: 
                  node-version: 24
                  cache: npm
              # package-lock.jsonからインストール
            - run: npm ci

            - run: npm run test